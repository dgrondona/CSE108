<!DOCTYPE html>

<html>
<head>

    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="calculator">

    <div id="output">0</div>

    <button class="button" id="backspace">⌫</button>
    <button class="button" id="clear">AC</button>
    <button class="button" id="percent">%</button>
    <button class="button operator" data-operator="/">÷</button>

    <button class="button number">7</button>
    <button class="button number">8</button>
    <button class="button number">9</button>
    <button class="button operator" data-operator="*">x</button>

    <button class="button number">4</button>
    <button class="button number">5</button>
    <button class="button number">6</button>
    <button class="button operator" data-operator="-">-</button>

    <button class="button number">1</button>
    <button class="button number">2</button>
    <button class="button number">3</button>
    <button class="button operator" data-operator="+">+</button>

    <button class="button plusMinus">+/-</button>
    <button class="button number">0</button>
    <button class="button decimal">.</button>
    <button class="button" id="equals">=</button>

</div>

<script src="script.js"></script>

</body>
</html>
